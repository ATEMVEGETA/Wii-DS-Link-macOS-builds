name: Free experimental macOS builds
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Mac architecture
        required: true
        type: choice
        options: [arm64, x86_64]
        default: arm64
      component:
        description: Build both emulators, or retry one
        required: true
        type: choice
        options: [both, melonDS, Dolphin]
        default: both
permissions:
  contents: read
concurrency:
  group: experimental-macos-${{ inputs.architecture }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event.repository.private == false && github.repository == 'ATEMVEGETA/Wii-DS-Link-macOS-builds' }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      JOBS: "2"
      QT_VERSION: "6.8.3"
      EXPECTED_ARCH: ${{ inputs.architecture }}
      COMPONENT: ${{ inputs.component }}
    steps:
      - name: Checkout build helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce free public standard-runner policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ATEMVEGETA/Wii-DS-Link-macOS-builds
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install free packaging tools
        shell: bash
        run: python3 -m pip install aqtinstall==3.3.0 cryptography==44.0.3
      - name: Checkout public melonDS hotfix source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ATEMVEGETA/melonDS
          ref: aca81fea811cc96b2cd216dd8b3f6f447a601c8f
          path: sources/melonDS
          submodules: recursive
          persist-credentials: false
      - name: Checkout public Dolphin source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ATEMVEGETA/Dolphin
          ref: 22060863a04f086bd0c51a6fdf7500e27470d35d
          path: sources/dolphin
          submodules: recursive
          persist-credentials: false
      - name: Verify architecture and run ROM-free transport checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p out/logs
          bash scripts/tests/run-tests.sh sources/melonDS sources/dolphin out/tests
      - name: Install dependencies and pinned Qt SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja pkgconf sdl2 libarchive zstd faad2 enet
          python3 -m aqt install-qt mac desktop "$QT_VERSION" clang_64 \
            --outputdir "$PWD/qt-sdk" \
            --modules qtmultimedia qtsvg qtshadertools
          qt_tool="$(find "$PWD/qt-sdk/$QT_VERSION" -type f -name macdeployqt -print -quit)"
          test -n "$qt_tool"
          qt_root="$(dirname "$(dirname "$qt_tool")")"
          printf '%s\n' "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
          brew list --versions > out/logs/homebrew-versions.txt
          sw_vers > out/logs/host-macos.txt
          xcodebuild -version > out/logs/xcode.txt
          python3 -m pip freeze > out/logs/python-packages.txt
      - name: Build and deploy melonDS
        if: ${{ inputs.component == 'both' || inputs.component == 'melonDS' }}
        shell: bash
        run: |
          set -euo pipefail
          export MACOS_AUDITOR="$PWD/scripts/dolphin/audit_bundle.py"
          bash scripts/melonDS/build-melonds.sh \
            sources/melonDS build/melonDS out/melonDS "$EXPECTED_ARCH" "$QT_ROOT" \
            2>&1 | tee out/logs/melonds-build.txt
      - name: Build and deploy Dolphin
        if: ${{ inputs.component == 'both' || inputs.component == 'Dolphin' }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dolphin/build-dolphin.sh \
            sources/dolphin build/dolphin out/dolphin "$EXPECTED_ARCH" "$QT_ROOT" \
            2>&1 | tee out/logs/dolphin-build.txt
      - name: Create experimental archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package.py --workspace "$PWD" \
            --architecture "$EXPECTED_ARCH" --component "$COMPONENT" \
            --minimum-os "$MACOSX_DEPLOYMENT_TARGET" --qt-root "$QT_ROOT"
      - name: Encrypt results and diagnostics
        if: ${{ always() }}
        shell: bash
        run: python3 scripts/archive_and_seal.py --workspace "$PWD" --architecture "$EXPECTED_ARCH" --component "$COMPONENT"
      - name: Store only encrypted results in a draft release
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
          tag="encrypted-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft --target "$GITHUB_SHA" \
            --title "Encrypted macOS build $GITHUB_RUN_ID" \
            --notes "Encrypted experimental build results. No public emulator release."
          gh release upload "$tag" sealed/*.wdsenc --repo "$GITHUB_REPOSITORY"
